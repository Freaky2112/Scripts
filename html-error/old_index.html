<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
    <style>
        body {
            font-family: 'Courier New', monospace;
            background: #000000;
            color: #00ff00;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .message {
            text-align: center;
            font-size: 1.5rem;
        }
        .dots {
            animation: blink 1.5s infinite;
        }
        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }
    </style>
</head>

        Redirecting<span class="dots">...</span>
    </div>

    <script>
        // Array of all your error page HTML files
        const errorPages = [
            '400.html',

            '402.html',
            '403.html',
            '404.html',

            '500.html',
            '501.html',
            '502.html',
            '503.html',
            '504.html',
            '505.html',
            '506.html',
            '507.html',
            '508.html',
            '509.html',

</body>
</html>
